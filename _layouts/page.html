---
layout: default
---
<article class="page container">
  <header class="page__head">
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="page__body{% unless page.wide %} prose{% endunless %}">
    {{ content }}
  </div>
</article>

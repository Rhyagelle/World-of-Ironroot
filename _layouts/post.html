---
layout: default
---
<article class="page container">
  <header class="page__head">
    <p class="page__date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="page__body prose">
    {{ content }}
  </div>
  <p class="page__back"><a href="{{ '/news/' | relative_url }}">Back to all news</a></p>
</article>

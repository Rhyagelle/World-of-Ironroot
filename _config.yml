# ─────────────────────────────────────────────────────────────
#  Ironroot: a Jekyll theme for my Vintage Story server site
#  Edit this file first. Everything below is placeholder content.
# ─────────────────────────────────────────────────────────────

title: World of Ironroot
tagline: The world has forgotten you in its ancient years. You were once many, now you are the few. As a member of the Coalition, you set out to reclaim your homeworld and you right to exist.
description: Lore, mods, map and rules for the Ironroot Vintage Story server.
lang: en

# For a project site at https://USER.github.io/REPO set baseurl to "/REPO".
# For a user site (USER.github.io) or a custom domain, leave baseurl empty.
url: ""
baseurl: "/World-of-Ironroot"

# Set to false to skip loading web fonts (the theme falls back to system serifs).
google_fonts: true

# Shown in the connect plate on the home page, the footer and the Join page.
server:
  address: play.example.com:42420
  version: "1.22.7"
  mode: Survival
  whitelist: Apply on Discord (soon)
  discord: https://discord.gg/your-invite
  # Paste the address of your hosted web map to embed it on the Map page.
  # Leave empty to show setup instructions instead.
  map_url: ""

# ─── Build settings (you rarely need to change these) ────────

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

permalink: /news/:title/

plugins:
  - jekyll-sitemap
  - jekyll-feed

collections:
  lore:
    output: true
    permalink: /lore/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: lore
    values:
      layout: lore

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
